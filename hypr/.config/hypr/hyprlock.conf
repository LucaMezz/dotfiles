# Generated by matugen — do not edit manually.

general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

background {
    monitor =
    path = /home/luca/.cache/current-wallpaper
    blur_passes = 3
    blur_size = 5
    brightness = 0.75
    vibrancy = 0.17
    vibrancy_darkness = 0.0
    contrast = 1.0
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(e1e4daff)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 3
    shadow_color = rgba(00000099)
    shadow_size = 5
    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %d"
    color = rgba(c3c8bcee)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_color = rgba(00000088)
    shadow_size = 3
    position = 0, 20
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(8d9387aa)
    inner_color = rgba(43483fcc)
    font_color = rgba(e1e4daff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = 󰌾  Password
    hide_input = false
    rounding = 8
    check_color = rgba(a5d396ff)
    fail_color = rgba(ffb4abff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 300
    capslock_color = rgba(a0cfd2ff)
    position = 0, -100
    halign = center
    valign = center
}
